configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:80/admin"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-${SERVICE}
    hostname: ${SERVICE}
    ports:
      - 53:53/tcp
      - 53:53/udp
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true             
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_ACCEPT_DNS= false    
      - TS_AUTH_ONCE=true
      - TS_HOSTNAME= pihole
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ./config:/config
      - ./ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_domainNeeded: true
      FTLCONF_dns_upstreams: |-
        9.9.9.9
        149.112.112.112
        2620:fe::fe
        2620:fe::9
      FTLCONF_dns_revServers: |-
        true,192.168.0.0/24,192.168.0.1,lan
        true,100.64.0.0/10,100.100.100.100
      FTLCONF_dns_specialDomains_mozillaCanary: true
      FTLCONF_dns_specialDomains_iCloudPrivateRelay: true
      FTLCONF_dns_specialDomains_designatedResolver: true
    volumes:
      - /srv/appdata/${SERVICE}/etc-pihole:/etc/pihole
      - /srv/appdata/${SERVICE}/etc-dnsmasq.d:/etc/dnsmasq.d
    depends_on:
      - tailscale
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/16