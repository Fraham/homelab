configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:80/admin"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  tailscale:
    container_name: pihole-tailscale
    image: tailscale/tailscale:latest
    restart: unless-stopped
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_ACCEPT_DNS: false
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: false
      TS_HOSTNAME: pihole
    volumes:
      - /mnt/user/appdata/tailscale-pihole:/var/lib/tailscale
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun

  application:
    image: ${IMAGE_URL}
    network_mode: service:tailscale
    container_name: app-${SERVICE}
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      FTLCONF_dns_listeningMode: ALL
      FTLCONF_dns_domainNeeded: true
      FTLCONF_dns_upstreams: |-
        9.9.9.9
        149.112.112.112
        2620:fe::fe
        2620:fe::9
      FTLCONF_dns_revServers: |-
        true,192.168.0.0/24,192.168.0.1,lan
        true,100.64.0.0/10,100.100.100.100
      FTLCONF_dns_specialDomains_mozillaCanary: true
      FTLCONF_dns_specialDomains_iCloudPrivateRelay: true
      FTLCONF_dns_specialDomains_designatedResolver: true
    volumes:
      - /srv/appdata/${SERVICE}/etc-pihole:/etc/pihole
      - /srv/appdata/${SERVICE}/etc-dnsmasq.d:/etc/dnsmasq.d
    depends_on:
      - tailscale
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
