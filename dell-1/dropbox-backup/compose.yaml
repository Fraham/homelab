services:
  rclone-backup:
    image: rclone/rclone:latest
    container_name: rclone-backup

    volumes:
      - /srv/appdata:/data:ro
      - ~/.config/rclone/rclone.conf:/config/rclone/rclone.conf:ro

    labels:
      ofelia.enabled: "true"

      ofelia.job-exec.backup.schedule: "0 2 * * *"

      ofelia.job-exec.backup.command: >
        TODAY=$$(date +\%F) &&
        echo "Starting backup for $$TODAY" &&

        rclone copy /data dropbox_backup:HomelabBackups/$$TODAY \
          --create-empty-src-dirs \
          --exclude "**/cache/**" \
          --exclude "**/tmp/**" \
          --exclude "**/logs/**" &&

        echo "Removing backups older than 7 days" &&

        rclone delete dropbox_backup:HomelabBackups \
          --min-age 7d \
          --rmdirs

    restart: unless-stopped

  ofelia:
    image: mcuadros/ofelia:latest
    container_name: ofelia

    command: daemon --docker

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    restart: unless-stopped