version: '3.8'

services:
  rclone-backup:
    image: rclone/rclone:latest
    container_name: rclone_dropbox_backup
    restart: unless-stopped
    volumes:
      - /srv/appdata:/data:ro
      - /srv/appdata/rclone/rclone.conf:/config/rclone/rclone.conf
    environment:
      - TZ=Europe/London # Matches your local timezone for the folder dates
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "Starting daily backup: $$(date)"
          
          # 1. Copy to a new dated folder
          rclone copy /data/ dropbox_backup:HomelabBackups/backup-$$(date +%Y-%m-%d) --exclude "/rclone/**"
          
          # 2. Purge files older than 7 days
          rclone delete --min-age 7d dropbox_backup:HomelabBackups/
          
          echo "Backup complete. Sleeping for 24 hours..."
          sleep 86400
        done